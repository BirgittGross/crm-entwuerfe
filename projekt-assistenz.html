<script id="dc-logic" type="text/plain">
class Component extends DCLogic {
componentDidMount() {
  this.syncAd();
  if (this._dnd) return; this._dnd = true;
  const near = (e, sel) => (e.target && e.target.closest) ? e.target.closest(sel) : null;
  document.addEventListener('dragstart', (e) => {
    const card = near(e, '[data-dnd-id]'); if (!card) return;
    this._dndFrom = card.getAttribute('data-dnd-board');
    try { e.dataTransfer.setData('text/plain', card.getAttribute('data-dnd-id')); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
  });
  document.addEventListener('dragover', (e) => {
    const col = near(e, '[data-dnd-col]'); if (!col || col.getAttribute('data-dnd-board') !== this._dndFrom) return;
    e.preventDefault();
    const key = col.getAttribute('data-dnd-board') + ':' + col.getAttribute('data-dnd-col');
    if (this.state.dndOver !== key) this.setState({ dndOver: key });
  });
  document.addEventListener('dragleave', (e) => {
    const col = near(e, '[data-dnd-col]'); if (col && !col.contains(e.relatedTarget) && this.state.dndOver) this.setState({ dndOver: '' });
  });
  document.addEventListener('drop', (e) => {
    const col = near(e, '[data-dnd-col]'); if (!col) return;
    e.preventDefault();
    const board = col.getAttribute('data-dnd-board');
    let id = ''; try { id = e.dataTransfer.getData('text/plain'); } catch (err) {}
    this.setState({ dndOver: '' });
    if (id && board === this._dndFrom && this._dndMove && this._dndMove[board]) this._dndMove[board](id, Number(col.getAttribute('data-dnd-col')));
  });
  document.addEventListener('dragend', () => { this._dndFrom = ''; if (this.state.dndOver) this.setState({ dndOver: '' }); });
}
componentDidUpdate() { this.syncAd(); }
curAd() {
  const ads = (this.state && this.state.ads) || this.ads0 || [];
  const id = (this.state && this.state.cur) || (ads[0] && ads[0].id);
  return ads.find((a) => a.id === id) || ads[0] || { id: '', text: '' };
}
syncAd() {
  const ad = this.curAd();
  const t = ad.text || '';
  const el = typeof document !== 'undefined' ? document.getElementById('ad-editor') : null;
  if (!el) return;
  this._frags = this._frags || {};
  if (ad.id !== this._shownId) {
    if (this._shownId) this._frags[this._shownId] = { text: this._adShown, nodes: Array.from(el.childNodes) };
    this._shownId = ad.id;
    const fr = this._frags[ad.id];
    if (fr && fr.text === t) { el.replaceChildren(...fr.nodes); this._adShown = t; return; }
    this._adShown = null;
  }
  if (t === this._adShown) return;
  const heads = /^(ihre aufgaben|aufgaben|ihr profil|profil|anforderungen|wir bieten|das bieten wir|benefits|kontakt|über uns|über das unternehmen|interesse geweckt\?|ihre vorteile)\s*:?$/i;
